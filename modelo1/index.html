<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modais</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">

</head>
<body>
    <h1>
        ⭒ Galeria Shawn Mendes ⭒
    </h1>
    <main class="galeria">
            <img src="assets/shawn1.jpg" alt="Shawn Mendes Lindo" class="miniatura">
            <img src="assets/shawn2.jpg" alt="Shawn Mendes Perfeito" class="miniatura">
            <img src="assets/shawn3.jpg" alt="Shawn Mendes Maravilhoso" class="miniatura">
            <img src="assets/shawn4.jpg" alt="Shawn Mendes Incrivel" class="miniatura">
    </main>

    <div id="modal" class="modal">
        <button id="fechar" class="fechar">
            &times;
        </button>
        <div class="modal-conteudo">
            <img src="" alt="imagem-ampliada" class="imagemModal">
            <p id="nomeImagem"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
